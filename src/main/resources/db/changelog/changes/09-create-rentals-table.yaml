databaseChangeLog:
  - changeSet:
      id: create-rentals-table
      author: anton
      changes:
        - createTable:
            tableName: rentals
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rental_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: return_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: actual_return_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: car_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: rentals
            baseColumnNames: car_id
            referencedTableName: cars
            referencedColumnNames: id
            constraintName: fk_rentals_cars

        - addForeignKeyConstraint:
            baseTableName: rentals
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_rentals_users

        - sql:
            sql: |
              ALTER TABLE rentals
              ADD CONSTRAINT chk_return_date_gte_rental_date
              CHECK (return_date >= rental_date);

        - sql:
            sql: |
              ALTER TABLE rentals
              ADD CONSTRAINT chk_actual_return_date_gte_rental_date
              CHECK (actual_return_date IS NULL OR actual_return_date >= rental_date);
