spring.application.name=car-sharing

spring.datasource.url=jdbc:mysql://localhost:3306/car_sharing?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.expiration.time=50000000
jwt.secret.data=secretwordstosecretdatafromproperty12334567890

spring.docker.compose.enabled=false

