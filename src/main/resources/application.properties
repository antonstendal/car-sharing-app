spring.application.name=car-sharing

spring.datasource.url=jdbc:mysql://localhost:3306/car_sharing?useSSL\
  =false&serverTimezone=UTC&tinyInt1isBit=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.expiration.time=50000000
jwt.secret.data=${JWT_SECRET_DATA}

spring.docker.compose.enabled=false

telegram.bot-token=${TELEGRAM_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key= ${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
